name: Publish to npm (manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PUBLISH to confirm'
        required: true
        type: string

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm intent
        if: inputs.confirm != 'PUBLISH'
        run: |
          echo "::error::You must type PUBLISH to confirm. Got: ${{ inputs.confirm }}"
          exit 1

  ci:
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test
        env:
          FORCE_COLOR: '1'

  publish:
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Upgrade npm to a version that supports OIDC trusted publishing (>= 11.5.1).
      # --force bypasses the self-upgrade MODULE_NOT_FOUND bug where mid-upgrade
      # npm fails to resolve its own internal modules (e.g. 'promise-retry').
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest --force

      - run: npm ci

      - run: npm run build

      - name: Determine npm dist-tag from package.json
        id: dist_tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            echo "npm_tag=next" >> "$GITHUB_OUTPUT"
            echo "Publishing pre-release $VERSION to @next"
          else
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
            echo "Publishing $VERSION to @latest"
          fi

      # Authentication via OIDC trusted publisher (configured on npmjs.com).
      # No NPM_TOKEN needed.
      - run: npm publish --provenance --access public --tag ${{ steps.dist_tag.outputs.npm_tag }}
