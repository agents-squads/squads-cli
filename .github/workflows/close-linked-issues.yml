# Closing keywords ("Closes #N") only auto-close on merges to the DEFAULT branch.
# Our PRs merge to develop, so shipped issues stayed open until someone noticed
# (2026-07-06: 15 stale issues in one sweep). This closes them at develop-merge.
name: Close linked issues on develop merge

on:
  pull_request:
    types: [closed]
    branches: [develop]

permissions:
  issues: write

jobs:
  close-linked:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const text = `${pr.title}\n${pr.body || ''}`;
            // Standard GitHub closing keywords, same-repo refs only.
            const re = /\b(?:clos(?:e|es|ed)|fix(?:es|ed)?|resolv(?:e|es|ed))\s*:?\s+#(\d+)/gi;
            const nums = [...new Set([...text.matchAll(re)].map(m => Number(m[1])))];
            for (const n of nums) {
              try {
                const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number: n });
                if (issue.pull_request || issue.state === 'closed') continue;
                await github.rest.issues.createComment({
                  ...context.repo, issue_number: n,
                  body: `Closed by #${pr.number} — merged to develop.`,
                });
                await github.rest.issues.update({
                  ...context.repo, issue_number: n, state: 'closed', state_reason: 'completed',
                });
                core.info(`closed #${n}`);
              } catch (e) { core.warning(`#${n}: ${e.message}`); }
            }
