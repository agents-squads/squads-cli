name: CI

on:
  push:
    branches: [main, 'sprint/**', 'release/**']
  pull_request:
    branches: [main, 'sprint/**', 'release/**']

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Upload build artifacts (Node 20 only)
        if: matrix.node-version == 20
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

  smoke-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test squads init
        run: |
          # Create temp directory and init
          mkdir -p /tmp/test-init
          cd /tmp/test-init
          git init
          node $GITHUB_WORKSPACE/dist/cli.js init --skip-infra --force <<< ""

          # Verify expected files exist
          test -f CLAUDE.md || (echo "CLAUDE.md missing" && exit 1)
          test -f .claude/settings.json || (echo ".claude/settings.json missing" && exit 1)
          test -d .agents/squads/demo || (echo ".agents/squads/demo missing" && exit 1)
          test -f .agents/BUSINESS_BRIEF.md || (echo ".agents/BUSINESS_BRIEF.md missing" && exit 1)
          test -f .claude/skills/squads-workflow/instruction.md || (echo "squads-workflow skill missing" && exit 1)
          test -f .agents/memory/getting-started/state.md || (echo "seed memory missing" && exit 1)

          echo "✓ squads init smoke test passed"

      - name: Test squads status
        run: |
          cd /tmp/test-init
          node $GITHUB_WORKSPACE/dist/cli.js status || true
          echo "✓ squads status runs"

      - name: Test squads context
        run: |
          cd /tmp/test-init
          node $GITHUB_WORKSPACE/dist/cli.js context || true
          echo "✓ squads context runs"
