name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Node 18 dropped: EOL, and vitest/rolldown import `styleText` from
        # node:util, which exists only on Node >= 20.
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test
        env:
          FORCE_COLOR: '1'

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=critical
        continue-on-error: false

  # npm publishing does NOT happen here — publish.yml is the only OIDC trusted
  # publisher configured on npmjs.com. A publish attempt from this workflow
  # always fails (404 PUT) and used to block the GitHub Release step (#819).
  # See RELEASING.md for the full release procedure.
  github-release:
    runs-on: ubuntu-latest
    needs: [ci, security]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Determine prerelease
        id: dist_tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          prerelease: ${{ steps.dist_tag.outputs.prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Docs freshness binding (agents-squads/docs#2): tell the docs repo a
      # release happened so it regenerates its CLI reference + changelog.
      # Auth = short-lived GitHub App installation token minted in-run from
      # the Agents Squads app (DOCS_APP_ID + DOCS_APP_PRIVATE_KEY secrets) —
      # no long-lived PAT. Without the secrets, the docs repo's weekly cron
      # still catches up — this step just makes freshness same-day.
      - name: Mint docs dispatch token
        id: docs_token
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.DOCS_APP_ID }}
          private-key: ${{ secrets.DOCS_APP_PRIVATE_KEY }}
          owner: agents-squads
          repositories: docs

      - name: Notify docs site
        env:
          DOCS_TOKEN: ${{ steps.docs_token.outputs.token }}
        run: |
          if [ -z "$DOCS_TOKEN" ]; then
            echo "::notice::docs app token unavailable — docs regen rides the weekly cron instead"
            exit 0
          fi
          curl -sf -X POST \
            -H "Authorization: Bearer $DOCS_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/agents-squads/docs/dispatches \
            -d "{\"event_type\":\"cli-released\",\"client_payload\":{\"version\":\"${GITHUB_REF#refs/tags/v}\"}}"
