# .squads/config.yml — Project configuration for squads-cli
# Generated by `squads init`. Customize for your project.
# Environment variables override these values (SQUADS_* prefix).

# Agent execution
agent_timeout_minutes: 30      # Max time per agent (env: SQUADS_AGENT_TIMEOUT_MINUTES)
token_budget: 50000             # Max output tokens per squad conversation
cost_ceiling: 25                # Max estimated cost ($) per squad run

# Organization identity
company_name: ""                # Your company/org name (used in cognition engine)

# Services (optional — for `squads services` command)
# compose_file: ./docker/docker-compose.yml

# Telemetry
telemetry: true                 # Set false to opt out (env: SQUADS_TELEMETRY=false)
